name: Deploy AI Spectrum Adventure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --nologo --configuration Release

      - name: Build container image
        run: docker build -t ai-spectrum-adventure:${{ github.sha }} .

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure CLI
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az account show
            az group show --name rg-ai-spectrum-adventure --output table || az group create --name rg-ai-spectrum-adventure --location francecentral

      - name: Build and push image to ACR
        uses: azure/CLI@v2
        with:
          inlineScript: |
            ACR_NAME=$(az acr list --resource-group rg-ai-spectrum-adventure --query "[0].name" -o tsv)
            az acr build \
              --registry "$ACR_NAME" \
              --image spectrum-adventure:${{ github.sha }} \
              --file Dockerfile .

      - name: Update scene blob access and deploy app revision
        uses: azure/CLI@v2
        with:
          inlineScript: |
            ACR_NAME=$(az acr list --resource-group rg-ai-spectrum-adventure --query "[0].name" -o tsv)
            ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
            STORAGE_ACCOUNT=$(az storage account list --resource-group rg-ai-spectrum-adventure --query "[0].name" -o tsv)
            BLOB_ENDPOINT=$(az storage account show --name "$STORAGE_ACCOUNT" --resource-group rg-ai-spectrum-adventure --query primaryEndpoints.blob -o tsv)

            az deployment group create \
              --resource-group rg-ai-spectrum-adventure \
              --template-file infra/scene-assets.bicep \
              --parameters storageAccountName="$STORAGE_ACCOUNT"

            az containerapp update \
              --name spectrum-adventure-web \
              --resource-group rg-ai-spectrum-adventure \
              --image "$ACR_LOGIN_SERVER/spectrum-adventure:${{ github.sha }}" \
              --set-env-vars \
                AzureStorage__AllowPublicBlobAccess=true \
                AzureStorage__PublicBlobEndpoint="$BLOB_ENDPOINT"

      - name: Smoke test
        uses: azure/CLI@v2
        with:
          inlineScript: |
            APP_URL=$(az containerapp show --name spectrum-adventure-web --resource-group rg-ai-spectrum-adventure --query properties.configuration.ingress.fqdn -o tsv)
            echo "Smoke test URL: https://$APP_URL/health"
            curl -fsS "https://$APP_URL/health"
